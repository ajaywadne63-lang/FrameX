
name: Build FrameX TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build FrameX TV
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      # 4. Install Android SDK packages
      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Verify project files
      - name: Verify Android project
        run: |
          ls -la FrameX-Android
          test -f FrameX-Android/settings.gradle
          test -f FrameX-Android/build.gradle
          test -f FrameX-Android/app/build.gradle

      # 7. Build APK
      - name: Build FrameX TV APK
        run: gradle -p FrameX-Android assembleDebug

      # 8. Upload generated APK
      - name: Upload FrameX TV APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameX-TV-debug-apk
          path: FrameX-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
